# Publishes authentic GPL-3.0 MetroList source to a SEPARATE branch.
# Never modifies the Pulse 'main' branch or existing app.
# Source: https://github.com/MetrolistGroup/Metrolist
# GPL-3.0 notice and copyright acknowledgements are retained unchanged.
name: Publish MetroList source branch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-metrolist-source.yml

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout actual MetroList source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: MetrolistGroup/Metrolist
          ref: 876e355181fd3b04e7063b10442fef1b721d53b3
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unchanged GPL license and source identity
        run: |
          test -f upstream/LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" upstream/LICENSE
          test -d upstream/app/src
          test -d upstream/innertube
          test "$(git -C upstream rev-parse HEAD)" = "876e355181fd3b04e7063b10442fef1b721d53b3"

      - name: Publish exact source in metrolist-source branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          # GitHub's repository token cannot create files in .github/workflows
          # without workflow permission. Preserve the upstream CI examples in
          # UPSTREAM_CI_WORKFLOWS; do not alter any Android application sources.
          if [ -d upstream/.github/workflows ]; then
            mv upstream/.github/workflows upstream/UPSTREAM_CI_WORKFLOWS
          fi
          printf '%s\\n' \
            '# MetroList GPL-3.0 upstream snapshot' \
            '' \
            'This branch contains the MetroList Android source, based on:' \
            'https://github.com/MetrolistGroup/Metrolist' \
            '' \
            'Upstream commit: 876e355181fd3b04e7063b10442fef1b721d53b3' \
            'License: GPL-3.0, with original notices preserved.' \
            '' \
            'Only the upstream GitHub Actions YAML files were moved from' \
            '.github/workflows to UPSTREAM_CI_WORKFLOWS to satisfy GitHub' \
            'App permission restrictions. No Android app code was changed.' \
            > upstream/PULSE_UPSTREAM_SOURCE_NOTICE.md
          git -C upstream add -A
          # Create an independent root commit from this same app source tree
          # so we can publish without incomplete shallow Git history.
          snapshot_tree="$(git -C upstream write-tree)"
          snapshot_sha="$(printf '%s\\n' \
            'chore(import): MetroList GPL-3.0 app source; relocated CI workflow examples' \
            '' \
            'Upstream: https://github.com/MetrolistGroup/Metrolist' \
            'Commit: 876e355181fd3b04e7063b10442fef1b721d53b3' \
            'License: GPL-3.0 (see LICENSE)' \
            | git -C upstream -c user.name='Pulse Source Import' \
              -c user.email='import@users.noreply.github.com' commit-tree "$snapshot_tree")"
          git -C upstream push \
            "https://github.com/${{ github.repository }}.git" \
            "$snapshot_sha":refs/heads/metrolist-source

      - name: Print separate source branch link
        run: |
          echo "MetroList GPL-3.0 source available at:"
          echo "https://github.com/${{ github.repository }}/tree/metrolist-source"
          echo "Unchanged Pulse source stays at main."
