name: Build Pulse Music Metro Engine APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-pulse-metrolist.yml"

permissions:
  contents: read

jobs:
  build-pulse:
    name: Build branded Pulse Music Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Pulse-branded MetroList GPL source
        uses: actions/checkout@v4
        with:
          repository: HYNprince/pulse-music-android-2026
          ref: pulse-metrolist
          submodules: recursive
          path: pulse
          persist-credentials: false

      - name: Verify source attribution and original brand assets
        run: |
          test -f pulse/LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" pulse/LICENSE
          test -f pulse/PULSE_FORK_README.md
          grep -q 'Pulse Music' pulse/app/src/main/res/values/app_name.xml
          grep -q 'com.pulsemusic.player' pulse/app/build.gradle.kts
          grep -q '#1ED760' pulse/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37 preview and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Generate temporary test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile rebranded Pulse Music APK
        working-directory: pulse
        env:
          METROLIST_APP_NAME: Pulse Music
          METROLIST_APPLICATION_ID: com.pulsemusic.player
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug --no-daemon --console=plain --warning-mode summary

      - name: Upload branded APK with GPL source attribution
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Music-Metro-Engine-debug-APK
          retention-days: 7
          if-no-files-found: error
          path: |
            pulse/app/build/outputs/apk/foss/debug/*.apk
            pulse/LICENSE
            pulse/PULSE_FORK_README.md
