# Gmac: signed Android candidate. MANUAL ONLY. No GitHub Release is created.
# This file must live on the repository's default branch (main) to expose Run workflow.
name: Gmac - Signed candidate (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD_GMAC to create a signed APK (not a public release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gmac-signed-candidate
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'HYNprince/pulse-music-android-2026' && github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD_GMAC' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: gmac-signing

    steps:
      - name: Check out reviewed Gmac source
        uses: actions/checkout@v4
        with:
          # PINNED: review this commit and update AFTER replacing the uncleared test logo.
          ref: 4f618b0ecc7db08746dbf1cc26580ea04228e079
          persist-credentials: false

      - name: Verify Gmac project identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'val baseApplicationId = "com.gmac.player"' app/build.gradle.kts
          grep -Fq 'create("foss")' app/build.gradle.kts
          test -f LICENSE
          test -f PULSE_FORK_README.md

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 37 and SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Reconstruct private signing key on ephemeral runner
        shell: bash
        env:
          GMAC_KEYSTORE_BASE64: ${{ secrets.GMAC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GMAC_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${GMAC_KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" ]]; then
            echo 'Missing gmac-signing environment secrets; see SETUP.md.' >&2
            exit 1
          fi
          install -d -m 700 app/keystore
          umask 077
          printf '%s' "$GMAC_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          keytool -list -storetype PKCS12 \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" -alias gmac >/dev/null

      - name: Enable release signing for this build only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          t = p.read_text(encoding='utf-8')
          before = '        release {\n            isMinifyEnabled = true\n'
          after = ('        release {\n'
                   '            signingConfig = signingConfigs.getByName("release")\n'
                   '            isMinifyEnabled = true\n')
          if t.count(before) != 1:
              raise SystemExit('Unexpected Gradle layout: refusing to patch release signing.')
          p.write_text(t.replace(before, after, 1), encoding='utf-8')
          PY_PATCH

      - name: Build signed optimized FOSS release
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.GMAC_STORE_PASSWORD }}
          KEY_ALIAS: gmac
          KEY_PASSWORD: ${{ secrets.GMAC_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleFossRelease

      - name: Verify APK identity and signature, package artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f \
                 -name '*.apk' -path '*/release/*' ! -name '*unsigned*' -print -quit)"
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo 'No signed FOSS release APK found.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
             | grep -m1 "^package: name='com.gmac.player' "
          mkdir -p dist
          cp "$apk" dist/Gmac-Signed-Candidate.apk
          (cd dist && sha256sum Gmac-Signed-Candidate.apk > Gmac-Signed-Candidate.apk.sha256)

      - name: Upload signed candidate (NOT a published GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: Gmac-Signed-Candidate
          path: |
            dist/Gmac-Signed-Candidate.apk
            dist/Gmac-Signed-Candidate.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore from workspace
        if: always()
        shell: bash
        run: rm -f app/keystore/release.keystore
